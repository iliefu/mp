<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  html,body{margin:0;padding:0;background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;}
  #toolbar{position:sticky;top:0;background:#fff;padding:8px 8px 0;box-shadow:0 1px 3px rgba(0,0,0,.1);z-index:10;}
  #toolbar select{width:100%;padding:8px;border-radius:6px;border:1px solid #ddd;font-size:14px;margin-bottom:8px;}
  #toolbar2{display:flex;gap:8px;background:#fff;padding:0 8px 8px;box-shadow:0 1px 3px rgba(0,0,0,.1);}
  #toolbar2 button{flex:1;padding:10px 0;border:none;border-radius:6px;background:#07c160;color:#fff;font-size:14px;}
  #toolbar2 button.secondary{background:#576b95;}
  #editWrap{padding:12px;}
  #mdInput{width:100%;box-sizing:border-box;height:40vh;font-size:14px;padding:8px;border:1px solid #ddd;border-radius:6px;}
  #previewWrap{padding:12px;display:none;}
  #rendered{background:#fff;padding:16px;border-radius:6px;}
  #rendered img{max-width:100%;}
  #tip{font-size:12px;color:#999;padding:0 12px;}
  #shortcodeHelp{margin:8px 12px;font-size:12px;color:#555;}
  #shortcodeHelp summary{cursor:pointer;color:#576b95;font-size:13px;}
  #shortcodeHelp pre{background:#f5f5f5;padding:8px;border-radius:6px;overflow-x:auto;font-size:11px;line-height:1.6;white-space:pre-wrap;word-break:break-all;}
</style>
</head>
<body>
<div id="toolbar">
  <select id="templateSelect"></select>
</div>
<div id="toolbar2">
  <button id="btnEdit" class="secondary">编辑</button>
  <button id="btnRender">预览排版</button>
  <button id="btnCopy">复制富文本</button>
</div>
<div id="tip">提示:复制后切到"返回公众号编辑器",长按粘贴即可保留格式</div>
<details id="shortcodeHelp">
  <summary>编辑部风格特殊模块语法(点开看用法)</summary>
    <label style="display:flex;align-items:center;gap:6px;margin:8px 0;">
      <input type="checkbox" id="autoFooterEnabled">
      每篇自动追加文末引导条(不用每次手打 :::footer)
    </label>
    <input type="text" id="autoFooterText" style="width:100%;box-sizing:border-box;padding:6px;border:1px solid #ddd;border-radius:4px;font-size:12px;margin-bottom:8px;" placeholder="引导条文字,例如:☝关注｜点赞👍转发↗️在看❤️留言💬">
  <pre>:::note
大标题文字
摘要正文，**关键词**会变橙色加粗，==关键词==会带青色虚线下划线
:::

:::bar
黑底白字通栏提示条文字
:::

:::cards
01: 第一个看点
02: 第二个看点
03: 第三个看点
:::

:::h
01
小节标题文字
:::

:::end
写在最后
结尾正文，支持**加粗**
:::

:::footer
END NOTE | 保持观察
:::</pre>
</details>
<div id="editWrap">
  <textarea id="mdInput" placeholder="在此粘贴或输入Markdown内容,也可以用上方按钮打开.md文件..."></textarea>
</div>
<div id="previewWrap">
  <div id="rendered" contenteditable="true"></div>
</div>

<script>
var editWrap = document.getElementById('editWrap');
var previewWrap = document.getElementById('previewWrap');
var mdInput = document.getElementById('mdInput');
var rendered = document.getElementById('rendered');
var templateSelect = document.getElementById('templateSelect');
var currentStyleMap = {};

var autoFooterEnabled = document.getElementById('autoFooterEnabled');
var autoFooterText = document.getElementById('autoFooterText');
var DEFAULT_FOOTER_TEXT = '☝关注｜点赞👍转发↗️在看❤️留言💬';

(function initAutoFooter() {
  var savedEnabled = null;
  var savedText = null;
  try {
    savedEnabled = localStorage.getItem('wemd_auto_footer_enabled');
    savedText = localStorage.getItem('wemd_auto_footer_text');
  } catch (e) {}
  autoFooterEnabled.checked = savedEnabled === null ? true : savedEnabled === '1';
  autoFooterText.value = savedText || DEFAULT_FOOTER_TEXT;

  autoFooterEnabled.onchange = function () {
    try { localStorage.setItem('wemd_auto_footer_enabled', autoFooterEnabled.checked ? '1' : '0'); } catch (e) {}
  };
  autoFooterText.oninput = function () {
    try { localStorage.setItem('wemd_auto_footer_text', autoFooterText.value); } catch (e) {}
  };
})();
  
// 兜底样式:如果 templates/*.json 因为某些机型/环境原因加载失败,
// 预览排版时至少还能用这套内置最简样式,不会完全没格式。
var FALLBACK_STYLE_MAP = {
  H1: 'font-size:22px;font-weight:bold;margin:20px 0 10px;',
  H2: 'font-size:19px;font-weight:bold;margin:18px 0 8px;',
  H3: 'font-size:17px;font-weight:bold;margin:16px 0 8px;',
  P: 'font-size:16px;line-height:1.75;margin:8px 0;',
  LI: 'font-size:16px;line-height:1.75;margin:4px 0;',
  STRONG: 'font-weight:bold;',
  BLOCKQUOTE: 'border-left:4px solid #ccc;color:#888;padding:4px 16px;margin:12px 0;',
  CODE: 'font-family:monospace;background:#f5f5f5;padding:2px 4px;border-radius:3px;',
  PRE: 'background:#282c34;color:#abb2bf;padding:12px;border-radius:6px;overflow-x:auto;',
  IMG: 'max-width:100%;'
};

// ============================================================
// 编辑部风格特殊模块:::name ... ::: 简写语法预处理
// 这些模块(三卡片预览行、黑底提示条、带编号小节标题等)不是Markdown原生语法能表达的
// 结构,所以在交给marked.js解析之前先把 :::xxx ... ::: 整块摘出来,直接生成固定样式的
// HTML片段,渲染时再用占位符换回去,不走marked的markdown解析。
// ============================================================
function mdInline(text) {
  var escaped = (text || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  escaped = escaped.replace(/\*\*(.+?)\*\*/g, '<span style="color:#E67E3C;font-weight:bold;">$1</span>');
  escaped = escaped.replace(/==(.+?)==/g, '<span style="border-bottom:1px dotted #3B9B94;color:#1A1A1A;">$1</span>');
  escaped = escaped.replace(/\n/g, '<br>');
  return escaped;
}

function buildShortcodeBlock(name, content) {
  var lines = content.split('\n');
  if (name === 'note') {
    var title = lines[0] || '';
    var summary = lines.slice(1).join('\n');
    return '<section style="background:#FAF8F3;border:1px solid #E5E0D8;border-radius:4px;padding:24px 20px;margin:0 0 20px;">' +
      '<section style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">' +
      '<span style="width:6px;height:6px;border-radius:50%;background:#1A1A1A;display:inline-block;"></span>' +
      '<span style="font-size:12px;letter-spacing:3px;color:#1A1A1A;font-weight:bold;">EDITORIAL NOTE</span>' +
      '<span style="flex:1;height:1px;background:#D8D2C5;"></span>' +
      '</section>' +
      '<p style="font-size:24px;font-weight:900;color:#1A1A1A;line-height:1.4;margin:0 0 16px;">' + mdInline(title) + '</p>' +
      '<p style="font-size:15px;color:#3A3A3A;line-height:1.8;margin:0;">' + mdInline(summary) + '</p>' +
      '</section>';
  }
  if (name === 'bar') {
    return '<section style="background:#1A1A1A;color:#fff;font-size:15px;font-weight:bold;padding:14px 20px;border-radius:2px;margin:20px 0;">' + mdInline(content) + '</section>';
  }
  if (name === 'cards') {
    var items = lines.filter(function (l) { return l.trim(); }).map(function (l) {
      var idx = l.indexOf(':');
      var num = idx > -1 ? l.slice(0, idx).trim() : '';
      var text = idx > -1 ? l.slice(idx + 1).trim() : l.trim();
      return '<section style="flex:1;background:#F2F0EA;border-radius:4px;padding:12px 10px;">' +
        '<p style="font-size:12px;color:#E67E3C;font-weight:bold;margin:0 0 6px;">' + num + '</p>' +
        '<p style="font-size:13px;color:#1A1A1A;line-height:1.4;margin:0;">' + mdInline(text) + '</p>' +
        '</section>';
    }).join('');
    return '<section style="margin:20px 0;">' +
      '<p style="font-size:14px;color:#888;margin:0 0 10px;">本文看点</p>' +
      '<section style="display:flex;gap:8px;">' + items + '</section>' +
      '</section>';
  }
  if (name === 'h') {
    var num = lines[0] || '';
    var htitle = lines.slice(1).join(' ');
    return '<section style="display:flex;align-items:baseline;gap:12px;margin:32px 0 4px;">' +
      '<span style="font-size:26px;font-weight:900;color:#1A1A1A;">' + num + '</span>' +
      '<span style="font-size:19px;font-weight:bold;color:#1A1A1A;">' + mdInline(htitle) + '</span>' +
      '</section>' +
      '<p style="font-size:11px;letter-spacing:2px;color:#B0B0B0;margin:0 0 16px;">KEY INSIGHT</p>';
  }
  if (name === 'end') {
    var heading = lines[0] || '写在最后';
    var body = lines.slice(1).join('\n');
    return '<section style="background:#1A1A1A;color:#fff;border-radius:4px;padding:24px 20px;margin:24px 0;">' +
      '<p style="font-size:16px;font-weight:bold;color:#fff;margin:0 0 12px;">' + mdInline(heading) + '</p>' +
      '<p style="font-size:15px;color:#E0E0E0;line-height:1.8;margin:0;">' + mdInline(body) + '</p>' +
      '</section>';
  }
  if (name === 'footer') {
    var parts = content.split('|');
    var left = (parts[0] || '').trim();
    var right = (parts[1] || '').trim();
    return '<section style="background:#1A1A1A;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-radius:2px;margin:16px 0;">' +
      '<span style="font-size:13px;letter-spacing:2px;">' + mdInline(left) + '</span>' +
      '<span style="font-size:13px;color:#ccc;">' + mdInline(right) + '</span>' +
      '</section>';
  }
  return '<section style="padding:12px;background:#fee;color:#900;border-radius:4px;">未知模块类型: ' + name + '</section>';
}

function preprocessShortcodes(md) {
  var blocks = [];
  var re = /:::(\w+)\n([\s\S]*?)\n:::/g;
  var replaced = md.replace(re, function (match, name, content) {
    var html = buildShortcodeBlock(name, content.trim());
    var idx = blocks.length;
    blocks.push(html);
    return '\n\n@@WEMD_BLOCK_' + idx + '@@\n\n';
  });
  return { text: replaced, blocks: blocks };
}

function injectShortcodeBlocks(html, blocks) {
  blocks.forEach(function (blockHtml, idx) {
    var token = '@@WEMD_BLOCK_' + idx + '@@';
    var wrapped = new RegExp('<p>\\s*' + token + '\\s*</p>', 'i');
    if (wrapped.test(html)) {
      html = html.replace(wrapped, blockHtml);
    } else {
      html = html.split(token).join(blockHtml);
    }
  });
  return html;
}

// 微信公众号编辑器粘贴时对HTML做净化处理,只认识 p/span/section/a/img/strong/em/code 这几个
// 它自己内部编辑器也在用的标签,遇到 h1~h6/blockquote/pre/ul/ol 这类语义化标签经常会整段丢样式、
// 甚至替换成没有格式的纯文本段落。这里在"复制"这一步,把预览区克隆一份,统一拍平转换成
// <section> 标签(列表项手动补上符号/序号,代码块保留手动换行),预览区本身保持不变方便阅读编辑。
var WECHAT_SAFE_TAGS = ['P', 'SPAN', 'A', 'IMG', 'STRONG', 'EM', 'B', 'I', 'BR', 'CODE',
  'TABLE', 'THEAD', 'TBODY', 'TR', 'TD', 'TH', 'SECTION'];

function renameToSection(el) {
  var section = document.createElement('section');
  for (var i = 0; i < el.attributes.length; i++) {
    var attr = el.attributes[i];
    section.setAttribute(attr.name, attr.value);
  }
  while (el.firstChild) {
    section.appendChild(el.firstChild);
  }
  el.parentNode.replaceChild(section, el);
  return section;
}

function elementDepth(el) {
  var d = 0;
  while (el.parentElement) { d++; el = el.parentElement; }
  return d;
}

function flattenForWeChatPaste(root) {
  root.querySelectorAll('pre').forEach(function (pre) {
    var codeEl = pre.querySelector('code');
    var text = codeEl ? codeEl.textContent : pre.textContent;
    pre.textContent = text;
    var existingStyle = pre.getAttribute('style') || '';
    pre.setAttribute('style', existingStyle + 'white-space:pre-wrap;word-break:break-all;');
  });

  root.querySelectorAll('ul, ol').forEach(function (listEl) {
    var isOrdered = listEl.tagName === 'OL';
    var idx = 1;
    Array.prototype.forEach.call(listEl.children, function (li) {
      if (li.tagName !== 'LI') return;
      var marker = isOrdered ? (idx + '. ') : '• ';
      idx++;
      li.insertBefore(document.createTextNode(marker), li.firstChild);
    });
  });

  var toConvert = [];
  root.querySelectorAll('*').forEach(function (el) {
    if (WECHAT_SAFE_TAGS.indexOf(el.tagName) === -1) {
      toConvert.push(el);
    }
  });
  toConvert.sort(function (a, b) { return elementDepth(b) - elementDepth(a); });
  toConvert.forEach(function (el) {
    if (el.parentNode) renameToSection(el);
  });
}

document.getElementById('btnEdit').onclick = function () {
  editWrap.style.display = 'block';
  previewWrap.style.display = 'none';
};

function applyInlineStyle(root) {
  root.querySelectorAll('*').forEach(function (el) {
    var tag = el.tagName;
    if (tag === 'PRE') {
      var codeEl = el.querySelector('code');
      if (codeEl) codeEl.setAttribute('style', 'background:none;color:inherit;padding:0;');
    }
    if (tag === 'CODE' && el.parentElement && el.parentElement.tagName === 'PRE') {
      return;
    }
    if (currentStyleMap[tag]) {
      var existing = el.getAttribute('style') || '';
      el.setAttribute('style', existing + currentStyleMap[tag]);
    }
    var parentTag = el.parentElement ? el.parentElement.tagName : null;
    if (parentTag) {
      var compoundKey = parentTag + ' ' + tag;
      if (currentStyleMap[compoundKey]) {
        var existing2 = el.getAttribute('style') || '';
        el.setAttribute('style', existing2 + currentStyleMap[compoundKey]);
      }
    }
  });
}

function loadManifestAndTemplates() {
  fetch('templates/manifest.json')
    .then(function (res) { return res.json(); })
    .then(function (list) {
      templateSelect.innerHTML = '';
      list.forEach(function (t) {
        var opt = document.createElement('option');
        opt.value = t.id;
        opt.textContent = t.name;
        templateSelect.appendChild(opt);
      });
      var saved = null;
      try { saved = localStorage.getItem('wemd_template'); } catch (e) {}
      if (saved && list.some(function (t) { return t.id === saved; })) {
        templateSelect.value = saved;
      }
      return loadTemplate(templateSelect.value);
    })
    .catch(function (err) {
      console.error('模板列表加载失败', err);
      currentStyleMap = FALLBACK_STYLE_MAP;
      var opt = document.createElement('option');
      opt.textContent = '内置默认(模板加载失败)';
      templateSelect.innerHTML = '';
      templateSelect.appendChild(opt);
    });
}

function loadTemplate(id) {
  return fetch('templates/' + id + '.json')
    .then(function (res) { return res.json(); })
    .then(function (map) {
      currentStyleMap = map;
      try { localStorage.setItem('wemd_template', id); } catch (e) {}
    })
    .catch(function (err) {
      console.error('模板加载失败: ' + id, err);
      currentStyleMap = FALLBACK_STYLE_MAP;
    });
}

templateSelect.onchange = function () {
  loadTemplate(templateSelect.value).then(function () {
    if (previewWrap.style.display !== 'none' && mdInput.value) {
      document.getElementById('btnRender').click();
    }
  });
};

loadManifestAndTemplates();

document.getElementById('btnRender').onclick = function () {
  var raw = mdInput.value || '';
  if (autoFooterEnabled.checked && raw.indexOf(':::footer') === -1) {
    var footerText = autoFooterText.value || DEFAULT_FOOTER_TEXT;
    raw = raw.replace(/\s+$/, '') + '\n\n:::footer\n' + footerText + '\n:::\n';
  }
  var pre = preprocessShortcodes(raw);

  var html = (typeof marked !== 'undefined') ? marked.parse(pre.text) : '<p>marked.js 加载失败,请检查网络连接</p>';
  html = injectShortcodeBlocks(html, pre.blocks);
  rendered.innerHTML = html;
  applyInlineStyle(rendered);
  editWrap.style.display = 'none';
  previewWrap.style.display = 'block';
};

document.getElementById('btnCopy').onclick = function () {
  var clone = rendered.cloneNode(true);
  flattenForWeChatPaste(clone);

  var hiddenHost = document.createElement('div');
  hiddenHost.style.position = 'fixed';
  hiddenHost.style.left = '-9999px';
  hiddenHost.style.top = '0';
  hiddenHost.appendChild(clone);
  document.body.appendChild(hiddenHost);

  var range = document.createRange();
  range.selectNodeContents(clone);
  var sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  try {
    document.execCommand('copy');
    if (window.AndroidBridge) window.AndroidBridge.onCopyDone();
  } catch (e) {
    if (window.AndroidBridge) window.AndroidBridge.onCopyFail(e.message);
  }
  sel.removeAllRanges();
  document.body.removeChild(hiddenHost);
};

function setMarkdownAndRender(text) {
  mdInput.value = text;
  document.getElementById('btnRender').click();
}
</script>
</body>
</html>
